name: Rabbitty Reconciliation Escalation Cron

on:
  schedule:
    # Cada 6 horas — escala conciliaciones sin respuesta del negocio tras 48h
    - cron: '30 */6 * * *'
  workflow_dispatch:

jobs:
  escalate-reconciliations:
    name: Escalate Stale Reconciliations (48h)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Reconciliation Escalation
        run: |
          APP_URL="${{ secrets.MEMBERSHIPS_APP_URL || 'https://app.rabbitty.me' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          echo "Escalating stale reconciliations against $APP_URL..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$APP_URL/api/cron/reconciliation" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Accept: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Reconciliation cron failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          ESCALATED=$(echo "$BODY" | grep -o '"escalated":[0-9]*' | cut -d: -f2)
          echo "Reconciliations escalated this run: ${ESCALATED:-0}"
