name: Rotate Database Secrets (Neon + Vercel + Railway)

on:
  workflow_dispatch: # Ejecución manual controlada con un click
  schedule:
    - cron: '0 4 1 * *' # Ejecuta automáticamente a las 4am el 1ro de cada mes

concurrency:
  group: database-secret-rotation
  cancel-in-progress: false

jobs:
  rotate:
    name: Zero-Downtime Secret Rotation
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Secret Rotation
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_ROLE_NAME: ${{ secrets.NEON_ROLE_NAME }}
          NEON_DATABASE_NAME: ${{ secrets.NEON_DATABASE_NAME }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID_APP: ${{ secrets.VERCEL_PROJECT_ID_APP }}
          VERCEL_PROJECT_ID_ADMIN: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: node scripts/rotate-db-secrets.mjs
