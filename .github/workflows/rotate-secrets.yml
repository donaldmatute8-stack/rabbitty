name: Rotate Database Secrets (Neon + Vercel + Railway)

# ─────────────────────────────────────────────────────────────────────────────
# DESACTIVADO EL 2026-11-16 (auditoría).
#
# Motivos, todos verificados en el código:
#  1. No instala dependencias y el script hace `import pg` → falla en segundos
#     (la corrida del 1 de noviembre terminó en 10 s con error).
#  2. Escribe `DATABASE_URL` en Railway/Vercel, pero la app lee
#     `RESTAURANT_DATABASE_URL` y `CORE_DATABASE_URL`. No rota lo que se usa.
#  3. Borra el rol anterior en la MISMA corrida: cero margen para revertir.
#  4. El healthcheck (`/api/auth/session` aceptando 401) da "sano" con la base rota.
#
# Se deja solo la ejecución manual, y aun así NO debe usarse hasta rediseñarlo
# (ver Docs/PROTECCION-DB-Y-SECRETOS-PLAN.md §3). El rediseño está pendiente de
# ventana de operación.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch: # Solo manual. El schedule mensual queda retirado.

concurrency:
  group: database-secret-rotation
  cancel-in-progress: false

jobs:
  rotate:
    name: Zero-Downtime Secret Rotation
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Secret Rotation
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_ROLE_NAME: ${{ secrets.NEON_ROLE_NAME }}
          NEON_DATABASE_NAME: ${{ secrets.NEON_DATABASE_NAME }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID_APP: ${{ secrets.VERCEL_PROJECT_ID_APP }}
          VERCEL_PROJECT_ID_ADMIN: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: node scripts/rotate-db-secrets.mjs
