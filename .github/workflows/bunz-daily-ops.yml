name: Bunz Daily Ops (mora + señales)

on:
  schedule:
    # diario 06:20 UTC: mora de obligaciones y detección de abuso (ambos read-only
    # respecto a saldos; mora solo cambia estado, abuso solo escribe señales)
    - cron: '20 6 * * *'
  workflow_dispatch:

jobs:
  daily:
    name: Mora y señales
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Barrido de mora (OT-2)
        run: |
          APP_URL="${{ secrets.ADMIN_APP_URL || 'https://admin.rabbitty.me' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$APP_URL/api/cron/obligations" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Accept: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Obligation sweep failed with HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Conciliación con pausa (RP-2B)
        run: |
          APP_URL="${{ secrets.ADMIN_APP_URL || 'https://admin.rabbitty.me' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$APP_URL/api/cron/reconciliation" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Accept: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Reconciliation failed with HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Señales de abuso (OT-5)
        run: |
          APP_URL="${{ secrets.ADMIN_APP_URL || 'https://admin.rabbitty.me' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$APP_URL/api/cron/abuse-signals" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Accept: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Abuse detection failed with HTTP $HTTP_STATUS"
            exit 1
          fi
