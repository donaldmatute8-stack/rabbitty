name: Bunzy Connect Scheduled

on:
  schedule:
    # Cada 5 minutos: publica broadcasts programados cuya hora ya llegó.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  publish-scheduled:
    name: Publish scheduled Bunzy Connect broadcasts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger scheduled publish
        run: |
          ADMIN_URL="${{ secrets.BUNZY_CONNECT_ADMIN_URL || 'https://admin.rabbitty.me' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          echo "Triggering Bunzy Connect cron against $ADMIN_URL..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$ADMIN_URL/api/cron/bunzy-connect" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Accept: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Bunzy Connect cron failed with HTTP $HTTP_STATUS"
            exit 1
          fi
