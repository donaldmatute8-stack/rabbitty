name: Rabbitty Memberships Cron

on:
  schedule:
    # Cada hora en punto (UTC) — expira suscripciones vencidas
    - cron: '0 * * * *'
  workflow_dispatch: # Trigger manual desde la pestaña Actions

jobs:
  expire-memberships:
    name: Expire Past-Due Memberships
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Memberships Expiration
        run: |
          APP_URL="${{ secrets.MEMBERSHIPS_APP_URL || 'https://app.rabbitty.me' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          echo "Triggering memberships expiration against $APP_URL..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$APP_URL/api/cron/memberships" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Accept: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Memberships cron failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          EXPIRED=$(echo "$BODY" | grep -o '"expiredNow":[0-9]*' | cut -d: -f2)
          echo "Memberships expired this run: ${EXPIRED:-0}"
