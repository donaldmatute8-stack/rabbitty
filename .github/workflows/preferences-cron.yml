name: Rabbitty Preferences Aggregation

on:
  schedule:
    # diario 09:00 UTC (03:00 MX): recalcula favoritos de los Rabbitters
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  preferences:
    name: Aggregate consumption preferences
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger preferences aggregation
        run: |
          APP_URL="${{ secrets.ADMIN_APP_URL || 'https://admin.rabbitty.me' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          echo "Aggregating preferences at $APP_URL..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$APP_URL/api/cron/preferences" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Preferences cron failed with HTTP $HTTP_STATUS"
            exit 1
          fi
