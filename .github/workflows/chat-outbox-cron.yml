name: Rabbitty Chat Outbox Cron

on:
  schedule:
    # Piso de reintentos del outbox de chat (el piggyback tras cada envío da
    # latencia baja cuando hay tráfico; esto recoge lo que falle).
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  drain-chat-outbox:
    name: Drain Chat Event Outbox
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Trigger Worker
        run: |
          APP_URL="${{ secrets.MEMBERSHIPS_APP_URL || 'https://app.rabbitty.me' }}"
          SECRET="${{ secrets.RABBITTY_API_SECRET || secrets.CRON_SECRET }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$APP_URL/api/cron/chat-outbox" \
            -H "Authorization: Bearer $SECRET")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Chat outbox worker failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Drained OK."
