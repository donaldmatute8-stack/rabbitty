name: Rabbitty Notification Worker Cron

on:
  schedule:
    # rearmed: re-registración de schedule tras fallos · corre cada 5 minutos — piso de latencia del outbox (el piggyback tras cada
    # POST /api/notifications da latencia baja cuando hay tráfico).
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  drain-notifications:
    name: Drain Notification Outbox
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Trigger Worker
        run: |
          APP_URL="${{ secrets.MEMBERSHIPS_APP_URL || 'https://app.rabbitty.me' }}"
          SECRET="${{ secrets.RABBITTY_API_SECRET || secrets.CRON_SECRET }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$APP_URL/api/cron/notifications-worker?limit=40" \
            -H "Authorization: Bearer $SECRET")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Notification worker failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Drained OK."

      # Respaldo: la fila de La Silla avanza cada 5 min aunque el workflow
      # dedicado no dispare. inviteNextWaiter es idempotente (una invitación
      # activa por activación), así que no duplica avisos.
      - name: Rabbit Chair waitlist (respaldo)
        if: always()
        continue-on-error: true
        run: |
          ADMIN_URL="${{ secrets.ADMIN_APP_URL || 'https://admin.rabbitty.me' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Sin CRON_SECRET; se omite la fila de La Silla."
            exit 0
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$ADMIN_URL/api/cron/rabbit-chair-waitlist" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Waitlist HTTP: $HTTP_STATUS"
          echo "Waitlist: $BODY"