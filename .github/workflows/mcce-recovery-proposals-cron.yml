name: MCCE Recovery Proposals

on:
  schedule:
    # día 1 de cada mes, 14:00 UTC: cierre de ciclo de recuperación
    - cron: '0 14 1 * *'
  workflow_dispatch:

jobs:
  proposals:
    name: Cierre de ciclo + propuesta
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger recovery proposals
        run: |
          APP_URL="${{ secrets.ADMIN_APP_URL || 'https://admin.rabbitty.me' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$APP_URL/api/cron/recovery-proposals" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Accept: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Recovery proposals failed with HTTP $HTTP_STATUS"
            exit 1
          fi
