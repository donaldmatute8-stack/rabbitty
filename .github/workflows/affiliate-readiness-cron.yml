name: Affiliate Readiness Nudge

on:
  schedule:
    # lunes 15:00 UTC: recordatorio semanal de lo que falta para salir a la app
    - cron: '0 15 * * 1'
  workflow_dispatch:

jobs:
  nudge:
    name: Readiness push + email
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger readiness nudge
        run: |
          APP_URL="${{ secrets.ADMIN_APP_URL || 'https://admin.rabbitty.me' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$APP_URL/api/cron/readiness" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Accept: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Readiness nudge failed with HTTP $HTTP_STATUS"
            exit 1
          fi
