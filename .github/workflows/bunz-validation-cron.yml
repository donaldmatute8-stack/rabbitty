name: Bunz Validation Cron

on:
  schedule:
    # viernes 15:00 UTC (9am MX): captura read-only + snapshot para el panel GOD
    - cron: '0 15 * * 5'
  workflow_dispatch:

jobs:
  capture:
    name: Captura económica (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger validation capture
        run: |
          APP_URL="${{ secrets.ADMIN_APP_URL || 'https://admin.rabbitty.me' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          echo "Triggering validation capture against $APP_URL..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$APP_URL/api/cron/validation" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Accept: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Validation capture failed with HTTP $HTTP_STATUS"
            exit 1
          fi
