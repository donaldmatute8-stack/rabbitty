name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run lint

  typecheck:
    name: Typecheck Guard (Mobile & Admin POS)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck Telegram MiniApp (User Mobile)
        run: pnpm --filter telegram-miniapp typecheck
      - name: Typecheck Rabbitty Admin / POS (Affiliates)
        run: pnpm --filter @rabbitty/admin typecheck

  test:
    name: Tests (Bunz & API Ledger)
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bunz unit tests
        run: pnpm exec vitest run
        working-directory: packages/bunz
      - name: API unit tests
        run: pnpm exec vitest run --exclude '**/*.integration.test.ts'
        working-directory: packages/api

  build:
    name: Build Guard (Isolated Apps)
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Mobile App (telegram-miniapp)
        run: pnpm --filter telegram-miniapp build
      - name: Build Admin & POS (@rabbitty/admin)
        run: pnpm --filter @rabbitty/admin build

